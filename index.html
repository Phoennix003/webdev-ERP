<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITPC Login Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
    LOGIN PAGE
    - Front-end only: accounts are checked in js/main.js (DUMMY_ACCOUNTS).
      Swap that check for a real backend/API call when you build one.
  -->

    <div class="login-screen">
      <div class="login-card">
        <h1>ITPC</h1>
        <p>Program Council ERP</p>

        <form id="loginForm">
          <div class="form-field">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter your username"
            />
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
            />
          </div>

          <p id="loginError" class="form-error" hidden></p>

          <button type="submit" class="btn btn-primary">Log In</button>
        </form>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
