<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITPC — Log in</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <script>
      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("itpc_theme") || "dark",
      );
    </script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!--
    LOGIN PAGE
    - Front-end only. Accounts are stored as salted password hashes in
      js/auth.js (ACCOUNTS); the login check, lockout and sessions live there too.
    - The red glow follows your mouse (see setupLoginSpotlight in main.js).
  -->

    <main class="login-screen" id="loginScreen">
      <button
        type="button"
        class="theme-toggle"
        id="themeToggle"
        aria-pressed="false"
      >
        <svg class="to-light" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
        <svg class="to-dark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <span class="to-light">Light mode</span>
        <span class="to-dark">Dark mode</span>
      </button>
      <div class="login-bg" aria-hidden="true"></div>

      <section class="login-hero">
        <img
          class="hero-logo"
          src="assets/itpc-logo.png"
          alt="ITPC logo"
          width="112"
          height="112"
        />
        <h1 class="wordmark">ITPC</h1>
        <p class="hero-name">Information Technology Program Council</p>
        <p class="hero-school">De La Salle University – Dasmariñas</p>
        <div class="year-tags" aria-label="Academic year 2026 to 2027">
          <span>2026</span><span>2027</span>
        </div>
      </section>

      <section class="login-card" id="loginCard">
        <h2>Sign in</h2>
        <p>Manage council assets and officers.</p>

        <p id="loginNotice" class="form-notice" role="status" hidden></p>

        <form id="loginForm" novalidate>
          <div class="form-field">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter your username"
              autocomplete="username"
            />
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
              />
              <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Show password"
              >
                Show
              </button>
            </div>
          </div>

          <p id="loginError" class="form-error" role="alert" hidden></p>

          <button type="submit" class="btn btn-primary">Log in</button>
        </form>
      </section>
    </main>

    <!-- auth.js must come first: main.js depends on it -->
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
