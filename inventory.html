<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITPC — Inventory</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <script>
      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("itpc_theme") || "dark",
      );
    </script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Sidebar: identical on every page. main.js adds "is-active" to the
         link for the current page and fills in the user chip. -->
      <aside class="sidebar">
        <a class="sidebar-brand" href="dashboard.html">
          <img
            src="assets/itpc-logo.png"
            alt="ITPC logo"
            width="42"
            height="42"
          />
          <span class="brand-text">
            <strong>ITPC</strong>
            <small>Program Council ERP</small>
          </span>
        </a>

        <ul class="sidebar-nav">
          <li>
            <a href="dashboard.html"
              ><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="7" height="9" rx="1" />
                <rect x="14" y="3" width="7" height="5" rx="1" />
                <rect x="14" y="12" width="7" height="9" rx="1" />
                <rect x="3" y="16" width="7" height="5" rx="1" /></svg
              >Dashboard</a
            >
          </li>
          <li>
            <a href="inventory.html"
              ><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 8l-9-5-9 5v8l9 5 9-5V8z" />
                <path d="M3 8l9 5 9-5M12 13v8" /></svg
              >Inventory</a
            >
          </li>
          <li>
            <a href="hr.html"
              ><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="9" cy="8" r="3.5" />
                <path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" />
                <circle cx="17" cy="9" r="2.5" />
                <path d="M17 14c2.8 0 4.5 1.9 4.5 4.5" /></svg
              >Officers</a
            >
          </li>
          <li>
            <a href="events.html"
              ><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="2" />
                <path d="M3 10h18M8 3v4M16 3v4" /></svg
              >Events</a
            >
          </li>
        </ul>

        <div class="sidebar-footer">
          <div class="user-chip">
            <span class="user-avatar" id="userAvatar">?</span>
            <span
              ><strong id="userName">Guest</strong><small id="userRole"></small
            ></span>
          </div>
          <button
            type="button"
            class="theme-toggle"
            id="themeToggle"
            aria-pressed="false"
          >
            <svg class="to-light" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
            <svg class="to-dark" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
            <span class="to-light">Light mode</span>
            <span class="to-dark">Dark mode</span>
          </button>
          <a href="index.html" id="logoutLink">Log out</a>
        </div>
      </aside>

      <main class="main-content">
        <div class="page-header">
          <div>
            <h1>Inventory</h1>
            <p>Track council assets, merch, and event materials.</p>
          </div>
          <button class="btn btn-primary admin-only" id="addItemBtn">
            + Add item
          </button>
        </div>

        <!-- Search + filters. Each select's data-filter matches a data-*
           attribute on the table rows. -->
        <div class="toolbar">
          <div class="search-wrap">
            <input
              type="text"
              id="searchInput"
              placeholder="Search items..."
              aria-label="Search inventory"
            />
            <kbd aria-hidden="true">/</kbd>
          </div>
          <div class="toolbar-filters">
            <select
              id="categoryFilter"
              data-filter="category"
              aria-label="Filter by category"
            >
              <option value="">All categories</option>
              <option value="merchandise">Merchandise</option>
              <option value="event-materials">Event materials</option>
              <option value="office-supplies">Office supplies</option>
            </select>
            <select
              id="statusFilter"
              data-filter="status"
              aria-label="Filter by status"
            >
              <option value="">All statuses</option>
              <option value="in-stock">In stock</option>
              <option value="low">Low stock</option>
            </select>
            <span
              class="result-count"
              id="resultCount"
              aria-live="polite"
            ></span>
          </div>
        </div>

        <div class="panel">
          <table>
            <thead>
              <tr>
                <!-- data-sort headers are clickable (sortable columns) -->
                <th data-sort="name">Item name</th>
                <th data-sort="category">Category</th>
                <th data-sort="quantity">Quantity</th>
                <th data-sort="status">Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <!-- Rows are rendered by main.js from saved data -->
            <tbody id="inventoryTableBody"></tbody>
          </table>
          <div class="empty-state" id="emptyState" hidden>
            <strong>No items found</strong>
            Try a different search or filter.
          </div>
        </div>
      </main>
    </div>

    <!-- Detail modal: title and list are filled in by main.js -->
    <div
      class="modal-overlay"
      id="viewModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="viewModalTitle"
    >
      <div class="modal-box">
        <button class="modal-close" aria-label="Close">&times;</button>
        <h2 id="viewModalTitle">Details</h2>
        <ul id="viewModalBody"></ul>
      </div>
    </div>

    <!-- Add / Edit item modal. The same form is used for both; main.js
       changes the title and button text depending on the mode. -->
    <div
      class="modal-overlay"
      id="addItemModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="addItemTitle"
    >
      <div class="modal-box">
        <button class="modal-close" aria-label="Close">&times;</button>
        <h2 id="addItemTitle">Add inventory item</h2>
        <form id="addItemForm" novalidate>
          <div class="form-field">
            <label for="itemName">Item name</label>
            <input type="text" id="itemName" name="itemName" />
          </div>
          <div class="form-field">
            <label for="itemCategory">Category</label>
            <select id="itemCategory" name="itemCategory">
              <option value="merchandise">Merchandise</option>
              <option value="event-materials">Event materials</option>
              <option value="office-supplies">Office supplies</option>
            </select>
          </div>
          <div class="form-field">
            <label for="itemQuantity">Quantity</label>
            <input
              type="number"
              id="itemQuantity"
              name="itemQuantity"
              min="0"
              step="1"
            />
          </div>
          <p id="addItemError" class="form-error" hidden></p>
          <button type="submit" class="btn btn-primary" id="addItemSubmit">
            Add item
          </button>
        </form>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/main.js"></script>
  </body>
</html>
