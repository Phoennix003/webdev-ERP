<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITPC Officers Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Sidebar: identical on every page. main.js adds "is-active" to the
         link matching the current page (Feature 1). -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          ITPC
          <span>Program Council ERP</span>
        </div>

        <ul class="sidebar-nav">
          <li>
            <a href="dashboard.html"
              ><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="7" height="9" rx="1" />
                <rect x="14" y="3" width="7" height="5" rx="1" />
                <rect x="14" y="12" width="7" height="9" rx="1" />
                <rect x="3" y="16" width="7" height="5" rx="1" /></svg
              >Dashboard</a
            >
          </li>
          <li>
            <a href="inventory.html"
              ><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 8l-9-5-9 5v8l9 5 9-5V8z" />
                <path d="M3 8l9 5 9-5M12 13v8" /></svg
              >Inventory</a
            >
          </li>
          <li>
            <a href="hr.html"
              ><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="9" cy="8" r="3.5" />
                <path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" />
                <circle cx="17" cy="9" r="2.5" />
                <path d="M17 14c2.8 0 4.5 1.9 4.5 4.5" /></svg
              >Officers</a
            >
          </li>
        </ul>

        <div class="sidebar-footer">
          <a href="index.html" id="logoutLink">Log Out</a>
        </div>
      </aside>

      <main class="main-content">
        <div class="page-header">
          <div>
            <h1>Officers</h1>
            <p>See current officers, their committee, and status.</p>
          </div>
          <button class="btn btn-primary admin-only" id="addOfficerBtn">
            + Add Officer
          </button>
        </div>

        <div class="toolbar">
          <input
            type="text"
            id="searchInput"
            placeholder="Search officers..."
            aria-label="Search officers"
          />
          <div class="toolbar-filters">
            <select
              id="positionFilter"
              data-filter="position"
              aria-label="Filter by position"
            >
              <option value="">All Positions</option>
              <option value="president">President</option>
              <option value="committee-head">Committee Head</option>
              <option value="member">Member</option>
            </select>
            <select
              id="statusFilter"
              data-filter="status"
              aria-label="Filter by status"
            >
              <option value="">All Statuses</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>

        <div class="panel">
          <table>
            <thead>
              <tr>
                <th data-sort="name">Name</th>
                <th data-sort="position">Position</th>
                <th data-sort="committee">Committee</th>
                <th data-sort="status">Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="officerTableBody"></tbody>
          </table>
          <div class="empty-state" id="emptyState" hidden>
            <strong>No officers found</strong>
            Try a different search or filter.
          </div>
        </div>
      </main>
    </div>

    <!-- Detail modal: title and list are filled in by main.js -->
    <div
      class="modal-overlay"
      id="viewModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="viewModalTitle"
    >
      <div class="modal-box">
        <button class="modal-close" aria-label="Close">&times;</button>
        <h2 id="viewModalTitle">Details</h2>
        <ul id="viewModalBody"></ul>
      </div>
    </div>

    <div
      class="modal-overlay"
      id="addOfficerModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="addOfficerTitle"
    >
      <div class="modal-box">
        <button class="modal-close" aria-label="Close">&times;</button>
        <h2 id="addOfficerTitle">Add officer</h2>
        <form id="addOfficerForm" novalidate>
          <div class="form-field">
            <label for="officerName">Name</label>
            <input type="text" id="officerName" name="officerName" />
          </div>
          <div class="form-field">
            <label for="officerPosition">Position</label>
            <select id="officerPosition" name="officerPosition">
              <option value="president">President</option>
              <option value="committee-head">Committee Head</option>
              <option value="member">Member</option>
            </select>
          </div>
          <div class="form-field">
            <label for="officerCommittee">Committee</label>
            <input type="text" id="officerCommittee" name="officerCommittee" />
          </div>
          <p id="addOfficerError" class="form-error" hidden></p>
          <button type="submit" class="btn btn-primary">Add officer</button>
        </form>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="main.js"></script>
  </body>
</html>
